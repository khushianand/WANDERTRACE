spring:
  application.name: wandertrace
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/wandertrace}
    username: ${DATABASE_USERNAME:wandertrace}
    password: ${DATABASE_PASSWORD:wandertrace}
  jpa.hibernate.ddl-auto: validate
  flyway.enabled: true
  mvc.servlet.path: /
server.error.include-message: never
management.endpoints.web.exposure.include: health,info
wandertrace.cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
