spring:
  application:
    name: wandertrace
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/wandertrace}
    username: ${DATABASE_USERNAME:wandertrace}
    password: ${DATABASE_PASSWORD:wandertrace}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_REQUEST_SIZE:500MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:500MB}
server:
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
wandertrace:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    local-path: ${MEDIA_LOCAL_PATH:./data/media}
  uploads:
    image-max-size: ${IMAGE_MAX_SIZE:25MB}
    video-max-size: ${VIDEO_MAX_SIZE:500MB}
    audio-max-size: ${AUDIO_MAX_SIZE:50MB}
