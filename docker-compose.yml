services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: ${POSTGRES_DB:-wandertrace}, POSTGRES_USER: ${POSTGRES_USER:-wandertrace}, POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wandertrace} }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 3s, retries: 15 }
    volumes: [postgres_data:/var/lib/postgresql/data]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: ${S3_ACCESS_KEY:-wandertrace}, MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-me-now} }
    ports: ["9000:9000","9001:9001"]
  backend:
    build: ./backend
    environment: { DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-wandertrace}, DATABASE_USERNAME: ${POSTGRES_USER:-wandertrace}, DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-wandertrace}, CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173} }
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["8080:8080"]
  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    depends_on: [backend]
    ports: ["5173:80"]
volumes: { postgres_data: {} }
